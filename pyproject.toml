[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ue5-doctor"
version = "1.0.0"
description = "Zero-dependency Unreal Engine 5.4-5.9 UBT/UAT/Cook log analyzer, LNK2019 Build.cs module mapper, and DefaultEngine.ini VRAM auditor."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Veristrux Inc.", email = "argoness@veristrux.com"}]
keywords = ["unreal-engine", "ue5", "gamedev", "openxr", "vram", "build-tools"]

[project.urls]
Homepage = "https://veristrux.com/"
Repository = "https://github.com/argoness-prime/ue5-doctor"

[project.scripts]
ue5-doctor = "ue5_doctor:main"

[tool.setuptools]
py-modules = ["ue5_doctor"]
